plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT' apply false
    id 'maven-publish'
}

group = 'com.chatfilter'
version = '1.0.2'

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    mappings 'net.fabricmc:yarn:26.3+build.2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.165.2+26.3'
    include 'net.fabricmc.fabric-api:fabric-api'
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
}

tasks.named('jar') {
    dependsOn 'processResources'
    manifest {
        attributes 'Implementation-Title': project.name,
                   'Implementation-Version': project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

loom {
    runs {
        client {
            workingDirectory project.file('run')
            property 'fabric-loader.mappings', 'yarn'
        }
    }
}